[project]
name = "kaetzli"
version = "0"
description = "Host-side tooling for kaetzli: the code behind the Python scripts in test/ and tools/"
requires-python = ">=3.12"
# Runtime dependencies are an argument each (CLAUDE.md, Host-side code):
#   pyelftools     the dynamic section, version tables and symbols of an ELF file, for
#                  the library checks; no dependencies of its own
#   python-debian  dpkg's version order, for cve-context's Debian verdicts; no
#                  dependencies of its own
#   spdx-tools     the SPDX project's library, for check-sbom's validation against the
#                  SPDX 2.3 model; brings rdflib, beartype, license-expression, click,
#                  pyyaml, xmltodict, ply, uritools, semantic-version (its other formats)
dependencies = [
    "pyelftools>=0.33",
    "python-debian>=1.1.1",
    "spdx-tools>=0.8.5",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
