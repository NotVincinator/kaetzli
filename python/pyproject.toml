# Not a package anyone builds or installs: python/launch.py puts src/ on the venv's path.
# The dependencies are requirements.in, locked as requirements.txt (python/README.md);
# this file is the baseline and the tools' configuration.
[project]
name = "kaetzli"
version = "0"
description = "Host-side tooling for kaetzli: the code behind the Python scripts in test/ and tools/"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# requirements.in → requirements.txt: ./lock.sh, on the 3.12 baseline (python/README.md).
[tool.pip-tools]
generate-hashes = true
allow-unsafe = true # pip and setuptools are pinned and hashed like the rest
strip-extras = true
quiet = true
output-file = "requirements.txt"
