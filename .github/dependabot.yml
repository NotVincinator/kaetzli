version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # python/uv.lock: the Python tools' dependencies (CLAUDE.md, Host-side code). A release
  # is proposed once it is two weeks old, the same rule as every other pin here; the
  # Python workflow runs the tests and lint on the pull request.
  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
